[package]
name = "gitflow-core"
description = "gf 核心库：Platform trait 抽象、跨平台适配器与 toon 输出。Core library: platform abstraction, adapters & toon output."
categories = ["development-tools"]
keywords = ["gitflow", "git", "cli", "core", "workflow"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation = "https://docs.rs/gitflow-core"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
chrono.workspace = true
toon-format.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest = "0.26"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "config_bench"
harness = false

[lints]
workspace = true
