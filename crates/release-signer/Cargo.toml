[package]
name = "release-signer"
version = "0.0.0"
publish = false
release = false
edition.workspace = true
license.workspace = true

[[bin]]
name = "release-signer"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
rand = { workspace = true }
zipsign-api = { workspace = true, features = ["sign-tar", "sign-zip", "verify-tar", "verify-zip"] }

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: build a structurally valid zip for zip-signing tests. Default
# features pull bzip2/ppmd/lzma/zstd codecs that fail cargo-deny license checks;
# deflate via zlib-rs is enough to create a plain zip entry.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
