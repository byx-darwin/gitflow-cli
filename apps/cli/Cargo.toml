[package]
name = "gitflow-cli"
description = "跨平台 Git 工程化工作流编排框架：统一封装 GitHub / GitLab / GitCode 三大平台，配合 AI Agent Skills，覆盖从需求到发布的完整工程循环。"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/gitflow-cli"
categories = ["development-tools", "command-line-utilities"]
keywords = ["gitflow", "git", "cli", "workflow", "automation"]
include = [
    "src/**",
    "build.rs",
    "README.md",
    "hooks/**",
]

[[bin]]
name = "gf"
path = "src/main.rs"

[dependencies]
gitflow-core = { workspace = true }
gitflow-github = { workspace = true }
gitflow-gitlab = { workspace = true }
gitflow-gitcode = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
dirs = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
is-terminal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
which = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
self_update = { workspace = true }
semver = { workspace = true }

[build-dependencies]
built = "0.7"

[features]
default = []
## 跳过 release binary 签名校验（开发/自建 release 用）。
## 启用后不会编译进公钥常量，`gf update` 不会验证 `.sig` 文件。
skip-verify = []

[dev-dependencies]
assert_cmd = { workspace = true }
trycmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
