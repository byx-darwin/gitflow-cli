[package]
name = "gitflow-cli"
description = "跨平台 Git 工程化工作流编排框架 CLI：统一封装 GitHub / GitLab / GitCode，配合 AI Agent Skills 覆盖需求到发布的完整工程循环。Cross-platform Git engineering workflow CLI."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/gitflow-cli"
categories = ["development-tools", "command-line-utilities"]
keywords = ["gitflow", "git", "cli", "workflow", "工作流"]
include = [
    "src/**",
    "build.rs",
    "README.md",
    "hooks/**",
]

[[bin]]
name = "gitflow-cli"
path = "src/main.rs"

[dependencies]
gitflow-cli-core = { workspace = true }
gitflow-cli-github = { workspace = true }
gitflow-cli-gitlab = { workspace = true }
gitflow-cli-gitcode = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
dirs = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
is-terminal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
which = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
built = "0.7"

[dev-dependencies]
assert_cmd = { workspace = true }
trycmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
temp-env = { workspace = true }

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
