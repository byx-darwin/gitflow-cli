name: "✨ 功能建议"
description: 提议新功能或改进
title: "[Feature]: "
labels: ["enhancement", "triage:needed"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！请描述你的需求和期望。
  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 这个功能要解决什么问题？
      placeholder: 当我执行 ... 时，经常遇到 ... 的问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你期望的解决方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案？
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - GitHub
        - GitLab
        - GitCode
        - 全平台
        - 平台无关
  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意尝试实现这个功能
        - label: 我可以提供测试反馈
