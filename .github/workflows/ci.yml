name: CI

on:
  push:
    # dev 不触发：dev 无分支保护，PR 的 pull_request run 已覆盖同一 commit。
    # 两处都跑等于同一份矩阵抢两次 runner 槽位，只会拖慢合并排队。
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Build release binary (for e2e tests)
        run: cargo build --release
      - name: Add to PATH
        run: echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH
      # e2e-gitlab/e2e-gitcode need the real `glab`/`gc` CLI binaries installed to
      # exercise their noauth.rs error-path assertions correctly (see
      # .github/workflows/e2e-tests.yml's dedicated jobs, which install them).
      # This generic 3-OS matrix job doesn't install them, so exclude those two
      # crates here — e2e-github stays included since `gh` ships preinstalled on
      # all three GitHub-hosted runner images.
      - name: cargo test
        run: cargo nextest run --all-features --workspace --exclude e2e-gitlab --exclude e2e-gitcode
      # nextest does not run doctests at all, so without this step the `# Examples`
      # blocks in public API docs are compiled and executed by nothing in CI.
      # Same crate exclusions as above, for the same reason.
      - name: cargo test --doc
        run: cargo test --doc --all-features --workspace --exclude e2e-gitlab --exclude e2e-gitcode
      # Issue #373: 唯一一次真实的 Windows 独立失败（2026-08-31）没有可复现路径，
      # 也没有留下能区分"资源限制 vs 测试本身"的证据。这一步只在失败时跑，采集
      # 当时的资源状态，供下次万一复现时判别根因。
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "## Failure diagnostics (${{ matrix.os }})"
            echo
            echo "### Toolchain"
            rustc --version
            cargo --version
            echo
            echo "### Disk space"
            df -h . || true
            echo
            echo "### Memory"
            if [ "${{ runner.os }}" = "Linux" ]; then
              free -h || true
            elif [ "${{ runner.os }}" = "macOS" ]; then
              vm_stat || true
            else
              wmic OS get FreePhysicalMemory,TotalVisibleMemorySize 2>/dev/null || \
                systeminfo | grep -i "memory" || true
            fi
          } > failure-diagnostics.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: failure-diagnostics.txt
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo +nightly fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: Install cargo-vet
        uses: taiki-e/install-action@cargo-vet

      - name: cargo vet
        run: cargo vet check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep 'rust-version' Cargo.toml | head -1 | sed 's/.*= *"//' | sed 's/"//')
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.msrv }}

      - name: Check with MSRV toolchain
        run: cargo +${{ steps.msrv.outputs.msrv }} check --workspace --all-features

  skill-docs:
    name: Skill Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # validate-skill-commands.sh 需要一个可执行的 gf 来枚举真实子命令，
      # 必须先构建（issue #342）。debug 构建足够且比 release 快。
      - name: Build gf (debug)
        run: cargo build --bin gf

      - name: Verify agent instructions and skill docs
        env:
          GF_BIN: ${{ github.workspace }}/target/debug/gf
        run: make check-agent-sync

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test (read-only)
        run: |
          ./target/release/gf --help
          ./target/release/gf issue list --help
          ./target/release/gf pr list --help
