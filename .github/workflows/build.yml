name: build

on:
  push:
    # dev 不触发：三平台构建矩阵最贵，而 PR 的 pull_request run 已构建同一 commit。
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── PR checks: fast feedback ─────────────────────────────────
  build-rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --component llvm-tools-preview
          rustup toolchain install nightly --component rustfmt --component clippy

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - uses: Swatinem/rust-cache@v2

      - name: Check code format
        if: runner.os == 'Linux'
        run: cargo +nightly fmt -- --check

      - name: Check the package for errors
        run: cargo check --workspace --all-targets --all-features

      - name: Lint rust sources
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check dependency licenses and advisories
        if: runner.os == 'Linux'
        run: cargo deny check

      - name: Check for known security vulnerabilities
        if: runner.os == 'Linux'
        run: cargo audit

      - name: Build release binary (for e2e tests)
        run: cargo build --release

      - name: Add to PATH
        run: echo "${{ github.workspace }}/target/release" >> $GITHUB_PATH

      - name: Execute rust tests
        run: cargo nextest run --all-features

      - name: Run CLI integration tests
        run: cargo test --workspace

  # ── MSRV check ─────────────────────────────────────────────
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep 'rust-version' Cargo.toml | head -1 | sed 's/.*= *"//' | sed 's/"//')
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.msrv }}

      - name: Check with MSRV toolchain
        run: cargo +${{ steps.msrv.outputs.msrv }} check --workspace --all-features
