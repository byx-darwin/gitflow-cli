name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      prerelease:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0)"
        required: true
      prerelease:
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: gf

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest' && !matrix.musl
        run: strip target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} || true

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }} ${{ env.BINARY_NAME }}
          cd ../../..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }} ${{ env.BINARY_NAME }}.exe
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | while read f; do cp "$f" release/; done

      # SLSA 供应链证明:对签名前的构建产物做 attestation(签名会修改文件哈希,
      # 故须在 Sign 之前;与移除前的 build.yml release job 行为一致)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tar.gz

      - name: Sign release assets
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          cargo run --bin release-signer -- sign \
            --key "$RELEASE_SIGNING_PRIVATE_KEY" \
            --input release/

      # 签名后再计算校验和:签名是嵌入式修改,先算哈希会对不上已发布资产
      - name: Checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}

      - name: Set tag output
        id: set-tag
        run: echo "tag_name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: Update Homebrew Formula
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute per-architecture SHA256
        id: sha
        run: |
          TAG="${{ needs.release.outputs.tag_name }}"
          REPO="${{ github.repository }}"

          declare -A URLS=(
            [arm64]=https://github.com/${REPO}/releases/download/${TAG}/gf-aarch64-apple-darwin.tar.gz
            [x86_64]=https://github.com/${REPO}/releases/download/${TAG}/gf-x86_64-apple-darwin.tar.gz
            [linux_arm64]=https://github.com/${REPO}/releases/download/${TAG}/gf-aarch64-unknown-linux-gnu.tar.gz
            [linux_x86_64]=https://github.com/${REPO}/releases/download/${TAG}/gf-x86_64-unknown-linux-gnu.tar.gz
          )

          for key in "${!URLS[@]}"; do
            SHA=$(curl -sL "${URLS[$key]}" | sha256sum | awk '{print $1}')
            echo "${key}=${SHA}" >> "$GITHUB_OUTPUT"
          done

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula in homebrew-tap
        run: |
          TAG="${{ steps.sha.outputs.tag }}"

          # Clone homebrew-tap repository
          git clone https://github.com/byx-darwin/homebrew-tap.git ../homebrew-tap
          cd ../homebrew-tap

          python3 << PYEOF
          import re

          FORMULA = "Formula/gf.rb"
          with open(FORMULA, "r") as f:
              content = f.read()

          # Update version in on_macos / on_linux url paths
          content = re.sub(
              r'(releases/download/)v[\d.]+/',
              r'\1' + "$TAG" + '/',
              content,
          )

          # Replace the four SHA256 values in document order:
          # macOS arm64, macOS x86_64, Linux arm64, Linux x86_64.
          new_shas = [
              "${{ steps.sha.outputs.arm64 }}",
              "${{ steps.sha.outputs.x86_64 }}",
              "${{ steps.sha.outputs.linux_arm64 }}",
              "${{ steps.sha.outputs.linux_x86_64 }}",
          ]

          idx = [0]
          def replace_sha(match):
              sha = new_shas[idx[0]]
              idx[0] += 1
              return f'sha256 "{sha}"'

          content = re.sub(r'sha256 "[0-9a-f]{64}"', replace_sha, content)

          with open(FORMULA, "w") as f:
              f.write(content)
          print(f"Updated {FORMULA} to $TAG")
          PYEOF

      - name: Commit and push formula update to homebrew-tap
        working-directory: ../homebrew-tap
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gf.rb
          git diff --cached --quiet || git commit -m "feat: update gf formula to ${{ steps.sha.outputs.tag }}"
          # The clone above is anonymous (public repo), so the remote carries no
          # credentials and git does not consult $GITHUB_TOKEN on its own — the push
          # died with "could not read Username for 'https://github.com'". Authenticate
          # the same way actions/checkout does: a basic-auth header scoped to the host,
          # which keeps the token out of .git/config and the process list.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push origin main

  publish-crates-io:
    name: Publish to crates.io
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Verify package
        run: |
          cargo package --list
          cargo package --no-verify

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set, skipping crates.io publish"
            echo "::warning::To enable crates.io publishing, add CARGO_REGISTRY_TOKEN to repository secrets"
            exit 0
          fi

          echo "Publishing to crates.io..."
          # Publish in dependency order
          cargo publish --token "$CARGO_REGISTRY_TOKEN" -p gitflow-core || true
          cargo publish --token "$CARGO_REGISTRY_TOKEN" -p gitflow-github || true
          cargo publish --token "$CARGO_REGISTRY_TOKEN" -p gitflow-gitlab || true
          cargo publish --token "$CARGO_REGISTRY_TOKEN" -p gitflow-gitcode || true
          cargo publish --token "$CARGO_REGISTRY_TOKEN" -p gitflow-cli || true
          echo "✓ Published to crates.io"
